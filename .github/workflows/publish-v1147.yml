name: Publish Longform Factory v1.14.7
on:
  push:
    paths:
      - "staging/v1.14.7/build_update.py"
permissions:
  contents: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python staging/v1.14.7/build_update.py
      - name: Publish package and feed
        run: |
          cp feed.v1147.json feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/LONGFORM_FACTORY_JP_BTS_DISCOVERY_UI_FIX_1_14_7.lfupdate.zip feed.json
          git commit -m "Publish Longform Factory v1.14.7 [skip ci]"
          git pull --rebase origin main
          git push

# historical workflow touch
