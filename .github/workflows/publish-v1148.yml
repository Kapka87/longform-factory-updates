name: Publish Longform Factory v1.14.8
on:
  push:
permissions:
  contents: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python staging/v1.14.8/build_update.py
      - name: Publish package and feed
        run: |
          cp feed.v1148.json feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/LONGFORM_FACTORY_RESULT_INPUT_STABILITY_1_14_8.lfupdate.zip feed.json
          git commit -m "Publish Longform Factory v1.14.8 [skip ci]"
          git pull --rebase origin main
          git push
