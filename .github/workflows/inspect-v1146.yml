name: Inspect Longform Factory v1.14.6 Inputs

on:
  push:
    paths:
      - "staging/v1.14.6/inspect_inputs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python staging/v1.14.6/inspect_inputs.py
      - name: Commit inspection snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/v1.14.6/inspection
          git commit -m "Inspect v1.14.5 JP_BTS contract inputs [skip ci]"
          git pull --rebase origin main
          git push
