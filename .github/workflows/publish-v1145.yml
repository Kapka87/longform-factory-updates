name: Publish Longform Factory v1.14.5

on:
  push:
    paths:
      - "staging/v1.14.5/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python staging/v1.14.5/build_hotfix.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          p=Path("packages/LONGFORM_FACTORY_FOUR_CHANNEL_PRODUCTION_1_14_5.lfupdate.zip")
          assert p.exists() and p.stat().st_size > 50000
          d=hashlib.sha256(p.read_bytes()).hexdigest()
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              m=json.loads(z.read("update_manifest.json"))
              assert m["version"]=="1.14.5"
              for f in m["files"]: assert hashlib.sha256(z.read(f["source"])).hexdigest()==f["sha256"]
              a=z.read("payload/adapters/channels/en_bts/production_adapter_v11.py").decode()
              r=z.read("payload/runners/en_bts_production_media_v10.py").decode()
              assert 'resolve_executable("ffmpeg")' in a and 'resolve_executable("ffprobe")' in a
              assert 'resolve_executable("ffmpeg")' in r and 'resolve_executable("ffprobe")' in r
          feed=json.loads(Path("feed.v1145.json").read_text())
          assert feed["channels"]["dev"]["package_sha256"]==d
          print({"bytes":p.stat().st_size,"sha256":d})
          PY
      - name: Publish
        run: |
          cp feed.v1145.json feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/LONGFORM_FACTORY_FOUR_CHANNEL_PRODUCTION_1_14_5.lfupdate.zip feed.json
          git commit -m "Publish Longform Factory v1.14.5 [skip ci]"
          git pull --rebase origin main
          git push