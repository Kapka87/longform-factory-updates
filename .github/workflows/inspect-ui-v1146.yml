name: Inspect v1.14.6 UI
on:
  push:
    paths:
      - ".github/workflows/inspect-ui-v1146.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python staging/v1.14.6/inspect_inputs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/v1.14.6/inspection_ui
          git commit -m "Inspect v1.14.6 result input UI [skip ci]"
          git pull --rebase origin main
          git push
