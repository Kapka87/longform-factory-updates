name: Publish Longform Factory v1.14.10
on:
  push:
    paths:
      - 'staging/v1.14.10/build_update.py'
      - '.github/workflows/publish-v11410.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: python staging/v1.14.10/build_update.py
      - name: Publish package and feed
        run: |
          python - <<'PY'
          import json,datetime
          p='feed.v11410.json'
          d=json.load(open(p))
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          d['generated_at']=now
          d['channels']['dev']['published_at']=now
          open('feed.json','w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add packages/LONGFORM_FACTORY_GREENLIGHT_REVIEW_1_14_10.lfupdate.zip feed.json
          git commit -m "Publish Longform Factory v1.14.10 [skip ci]"
          git push
