name: Publish Longform Factory Update

on:
  push:
    paths:
      - "staging/v1.12.3/**"
      - ".github/workflows/publish-update.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build remote update package
        run: python staging/v1.12.3/build_release.py
      - name: Commit package and feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json packages/LONGFORM_FACTORY_REASONING_OBSERVABILITY_FIX_1_12_3.lfupdate.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish Longform Factory v1.10.0 [skip ci]"
          git push
